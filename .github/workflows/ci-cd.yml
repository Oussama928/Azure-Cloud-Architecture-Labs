# GitHub Actions CI/CD Pipeline for ChangeTrace

name: ChangeTrace CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: changetrace29r2ywacr.azurecr.io
  IMAGE_TAG: ${{ github.sha }}
  AZURE_RESOURCE_GROUP: changetrace-29r2yw-rg
  AKS_CLUSTER_NAME: changetrace-dev-aks

jobs:
  # Lint & Test
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r services/collector/requirements.txt
          pip install -r services/correlation_engine/requirements.txt
          pip install -r services/dashboard_api/requirements.txt
          pip install -r functions/requirements.txt
          pip install -r ml/training/requirements.txt
      
      - name: Run Python linting
        run: |
          pip install ruff mypy
          ruff check services/collector services/correlation_engine services/dashboard_api functions/ ml/ --exclude ml/notebooks/exploration.ipynb --ignore F401,F403,E402,UP035 --select E9,F63,F7,F82,W292 || true
          mypy services/collector services/correlation_engine services/dashboard_api functions/ ml/ --ignore-missing-imports || true
        continue-on-error: true
      
      - name: Run Python tests
        run: |
          pytest services/collector/tests/ -v --cov=services/collector --cov-report=xml
          pytest services/correlation_engine/tests/ -v --cov=services/correlation_engine --cov-report=xml
          pytest services/graph_builder/tests/ -v --cov=services/graph_builder --cov-report=xml
          pytest services/risk_engine/tests/ -v --cov=services/risk_engine --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Dashboard Build
  dashboard-build:
    name: Build Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      
      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci
      
      - name: Run linting
        working-directory: ./dashboard
        run: npm run lint
        continue-on-error: true
      
      - name: Run tests
        working-directory: ./dashboard
        run: npm test -- --coverage
      
      - name: Build production
        working-directory: ./dashboard
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build/
          retention-days: 7

  # DOCKER BUILD & PUSH
  docker-build:
    name: Build & Push Docker Images
    needs: [lint-and-test, dashboard-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    
    strategy:
      matrix:
        service:
          - collector
          - correlation_engine
          - dashboard_api
          - graph_builder
          - postmortem_generator
          - risk_engine
          - mock_source
          - demo_app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: true
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
        # Retry on transient network errors (e.g. Docker Hub timeouts)
        timeout-minutes: 15
        env:
          DOCKER_BUILDKIT: 1
      
      # Retry build on transient failures
      - name: Retry build on failure
        if: failure() && steps.build-push.outcome == 'failure'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            docker buildx build \
              --platform linux/amd64 \
              --file ./services/${{ matrix.service }}/Dockerfile \
              --tag ${{ steps.meta.outputs.tags }} \
              --label ${{ steps.meta.outputs.labels }} \
              --push \
              .

  # FUNCTIONS BUILD & DEPLOY
  dashboard-image:
    name: Build & Push Dashboard Image
    needs: dashboard-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: true

      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          build-args: |
            VITE_API_BASE=/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/changetrace-dashboard:${{ github.sha }}
            ${{ env.REGISTRY }}/changetrace-dashboard:latest
          platforms: linux/amd64

  functions-build:
    name: Build & Deploy Functions
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -r functions/requirements.txt
      
      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
      
      - name: Build Functions package
        run: |
          cd functions
          rm -rf .python_packages
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt
          zip -r functionapp.zip . -x "*.git*" "__pycache__/*" "*.pyc" "tests/*" "*.zip" "local.settings.json" "host.json.bak"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Refresh AzureWebJobsStorage and Deploy Functions
        run: |
          # Get current storage connection string and update app setting
          STORAGE_KEY=$(az storage account keys list \
            --resource-group changetrace-29r2yw-rg \
            --account-name changetrace29r2ywsa \
            --query '[0].value' -o tsv)
          
          CONN_STRING="DefaultEndpointsProtocol=https;AccountName=changetrace29r2ywsa;AccountKey=${STORAGE_KEY};EndpointSuffix=core.windows.net"
          
          az functionapp config appsettings set \
            --resource-group changetrace-29r2yw-rg \
            --name changetrace-29r2yw-func \
            --settings "AzureWebJobsStorage=${CONN_STRING}"
          
          # Now deploy with func
          cd functions
          max_retries=5
          retry_delay=30
          for i in $(seq 1 $max_retries); do
            echo "=== Attempt $i of $max_retries ==="
            func azure functionapp publish changetrace-29r2yw-func --python --build remote --verbose 2>&1
            exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "Deployment successful!"
              exit 0
            fi
            echo "Deployment failed with exit code $exit_code. Waiting ${retry_delay}s..."
            sleep $retry_delay
          done
          echo "All retries exhausted."
          exit 1

  # TERRAFORM PLAN
  terraform-plan:
    name: Terraform Plan
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
      
      - name: Terraform Init
        working-directory: ./terraform
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=changetrace-tfstate-rg" \
            -backend-config="storage_account_name=changetracetfstate8324" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=changetrace.tfstate"
      
      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive
      
      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate
      
      - name: Terraform Plan
        id: plan
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        working-directory: ./terraform
        run: |
          terraform plan -out=tfplan -var-file=environments/dev/terraform.tfvars
      
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 7
      
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/tfplan', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan\n```\n' + plan + '\n```'
            })

  # TERRAFORM APPLY (dev)
  terraform-apply-dev:
    name: Terraform Apply (dev)
    needs: [terraform-plan, docker-build, functions-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
      
      - name: Terraform Init
        working-directory: ./terraform
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=changetrace-tfstate-rg" \
            -backend-config="storage_account_name=changetracetfstate8324" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=changetrace.tfstate"
      
      - name: Terraform Apply
        working-directory: ./terraform
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform apply -auto-approve tfplan

  # AKS DEPLOY
  aks-deploy:
    name: Deploy to AKS
    needs: [terraform-apply-dev, docker-build, dashboard-image]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Check if AKS exists
        id: aks-check
        run: |
          if az aks show --resource-group changetrace-29r2yw-rg --name changetrace-dev-aks &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Set AKS credentials
        if: steps.aks-check.outputs.exists == 'true'
        run: |
          az aks get-credentials \
            --resource-group changetrace-29r2yw-rg \
            --name changetrace-dev-aks \
            --overwrite-existing
      
      - name: Create/rotate secrets
        if: steps.aks-check.outputs.exists == 'true'
        run: |
          # ACR pull secret (idempotent: recreated with current ACR credentials)
          kubectl delete secret acr-pull-secret -n changetrace 2>/dev/null || true
          kubectl create secret docker-registry acr-pull-secret -n changetrace \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username="${{ secrets.ACR_USERNAME }}" \
            --docker-password="${{ secrets.ACR_PASSWORD }}"

          # Cosmos DB secret (idempotent: keeps existing value if already set)
          COSMOS_KEY=$(az cosmosdb keys list --name changetrace-29r2yw-cosmos \
            --resource-group changetrace-29r2yw-rg --query primaryMasterKey -o tsv)
          COSMOS_ENDPOINT="wss://changetrace-29r2yw-cosmos.gremlin.cosmos.azure.com:443/"
          kubectl delete secret changetrace-cosmos-secret -n changetrace 2>/dev/null || true
          kubectl create secret generic changetrace-cosmos-secret -n changetrace \
            --from-literal=cosmos-connection-string="AccountEndpoint=https://changetrace-29r2yw-cosmos.documents.azure.com:443/;AccountKey=${COSMOS_KEY};"

          # Internal auth token + simple auth secret
          if ! kubectl get secret changetrace-internal-secret -n changetrace &>/dev/null; then
            kubectl create secret generic changetrace-internal-secret -n changetrace \
              --from-literal=internal-auth-token="ct-$(openssl rand -hex 24)"
          fi
          if ! kubectl get secret changetrace-simple-auth-secret -n changetrace &>/dev/null; then
            kubectl create secret generic changetrace-simple-auth-secret -n changetrace \
              --from-literal=simple-auth-secret="changetrace-$(openssl rand -hex 24)"
          fi

      - name: Deploy to AKS
        if: steps.aks-check.outputs.exists == 'true'
        run: |
          # Apply Kubernetes manifests (placeholders in k8s/secrets are NOT applied)
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmaps/
          kubectl apply -f k8s/services/
          kubectl apply -f k8s/ingress/
          kubectl apply -f k8s/rbac/
          kubectl apply -f k8s/deployments/
      
      - name: Verify deployment
        if: steps.aks-check.outputs.exists == 'true'
        run: |
          kubectl rollout status deployment/changetrace-collector -n changetrace --timeout=300s
          kubectl rollout status deployment/changetrace-correlation-engine -n changetrace --timeout=300s
          kubectl rollout status deployment/changetrace-dashboard-api -n changetrace --timeout=300s
          kubectl rollout status deployment/changetrace-graph-builder -n changetrace --timeout=300s
          kubectl rollout status deployment/changetrace-risk-engine -n changetrace --timeout=300s
          kubectl rollout status deployment/changetrace-postmortem-generator -n changetrace --timeout=300s
          kubectl rollout status deployment/changetrace-mock-source -n changetrace --timeout=300s
          kubectl rollout status deployment/otel-collector -n changetrace --timeout=300s

  # CHAOS VALIDATION
  chaos-validation:
    name: Chaos Validation
    needs: aks-deploy
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Check if AKS exists
        id: aks-check
        run: |
          if az aks show --resource-group changetrace-29r2yw-rg --name changetrace-dev-aks &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run Chaos Experiments
        if: steps.aks-check.outputs.exists == 'true'
        run: |
          # Start AKS if stopped
          az aks start --resource-group changetrace-29r2yw-rg --name changetrace-dev-aks

          # Wait for cluster to be ready
          sleep 60
          az aks get-credentials --resource-group changetrace-29r2yw-rg \
            --name changetrace-dev-aks --overwrite-existing

          # Lightweight fault injection via kubectl (targets real deployments by label)
          bash chaos/scripts/k8s_chaos_runner.sh changetrace
  
      - name: Evaluate Results
        if: steps.aks-check.outputs.exists == 'true'
        run: |
          python chaos/scripts/evaluate_precision_recall.py --results-dir chaos/results/k8s --output evaluation_report.txt
      
      - name: Upload Evaluation Report
        if: steps.aks-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaos-evaluation-report
          path: evaluation_report.txt
          retention-days: 30
      
      - name: Stop AKS
        if: always() && steps.aks-check.outputs.exists == 'true'
        run: |
          az aks stop --resource-group changetrace-29r2yw-rg --name changetrace-dev-aks

  # NOTIFICATIONS
  notify:
    name: Notify
    needs: [lint-and-test, docker-build, functions-build, terraform-apply-dev]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Send notification
        if: always()
        run: |
          STATUS="${{ needs.lint-and-test.result }},${{ needs.docker-build.result }},${{ needs.functions-build.result }},${{ needs.terraform-apply-dev.result }}"
          echo "Pipeline status: $STATUS"
          if [ -n "${{ secrets.NOTIFICATION_WEBHOOK }}" ]; then
            curl -X POST ${{ secrets.NOTIFICATION_WEBHOOK }} \
              -H 'Content-Type: application/json' \
              -d "{\"text\": \"ChangeTrace pipeline completed with status: $STATUS\"}"
          else
            echo "No notification webhook configured, skipping notification"
          fi