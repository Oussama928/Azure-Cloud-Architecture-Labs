# Azure DevOps Pipeline for ChangeTrace

trigger:
  branches:
    include:
      - main
      - develop
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main
      - develop

variables:
  - group: changetrace-variables
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: dockerRegistry
    value: 'changetrace.azurecr.io'
  - name: kubernetesServiceConnection
    value: 'changetrace-aks-connection'
  - name: azureSubscription
    value: 'changetrace-subscription'
  - name: resourceGroup
    value: 'changetrace-rg'
  - name: aksClusterName
    value: 'changetrace-aks'

stages:
  # ============================================================
  # STAGE 1: BUILD & TEST
  # ============================================================
  - stage: BuildAndTest
    displayName: Build & Test
    jobs:
      - job: PythonServices
        displayName: Python Services (Collector, Correlation Engine, Dashboard API)
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
              addToPath: true
          
          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | services/collector/requirements.txt, services/correlation_engine/requirements.txt, services/dashboard_api/requirements.txt, functions/requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
          
          - script: |
              pip install -r services/collector/requirements.txt
              pip install -r services/correlation_engine/requirements.txt
              pip install -r services/dashboard_api/requirements.txt
              pip install -r functions/requirements.txt
            displayName: 'Install Python dependencies'
          
          - script: |
              pip install ruff mypy pytest pytest-asyncio pytest-mock pytest-cov
              ruff check services/collector services/correlation_engine services/dashboard_api functions/ ml/
              mypy services/collector services/correlation_engine services/dashboard_api functions/ ml/ --ignore-missing-imports
            displayName: 'Lint Python code'
          
          - script: |
              pytest services/collector/tests/ -v --cov=services/collector --cov-report=xml
              pytest services/correlation_engine/tests/ -v --cov=services/correlation_engine --cov-report=xml
              # pytest services/dashboard_api/tests/ -v --cov=services/dashboard_api --cov-report=xml
              # pytest functions/shared/tests/ -v --cov=functions --cov-report=xml
            displayName: 'Run Python tests'
          
          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
            displayName: 'Publish code coverage'

      - job: Dashboard
        displayName: Dashboard (React/TypeScript)
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 20
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | dashboard/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)
          
          - workingDirectory: dashboard
            script: |
              npm ci
            displayName: 'Install dependencies'
          
          - workingDirectory: dashboard
            script: |
              npm run lint
            displayName: 'Lint TypeScript/React'
          
          - workingDirectory: dashboard
            script: |
              npm test -- --watchAll=false --coverage
            displayName: 'Run tests'
          
          - workingDirectory: dashboard
            script: |
              npm run build
            displayName: 'Build production'
          
          - publish: dashboard/build
            artifact: dashboard-build
            displayName: 'Publish dashboard build'

  # ============================================================
  # STAGE 2: DOCKER BUILD & PUSH
  # ============================================================
  - stage: DockerBuild
    displayName: Build & Push Docker Images
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: BuildImages
        displayName: Build & Push Service Images
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 45
        strategy:
          matrix:
            collector:
              serviceName: collector
              dockerfilePath: services/collector/Dockerfile
              contextPath: services/collector
            correlation_engine:
              serviceName: correlation_engine
              dockerfilePath: services/correlation_engine/Dockerfile
              contextPath: services/correlation_engine
            dashboard_api:
              serviceName: dashboard_api
              dockerfilePath: services/dashboard_api/Dockerfile
              contextPath: services/dashboard_api
            graph_builder:
              serviceName: graph_builder
              dockerfilePath: services/graph_builder/Dockerfile
              contextPath: services/graph_builder
            postmortem_generator:
              serviceName: postmortem_generator
              dockerfilePath: services/postmortem_generator/Dockerfile
              contextPath: services/postmortem_generator
            risk_engine:
              serviceName: risk_engine
              dockerfilePath: services/risk_engine/Dockerfile
              contextPath: services/risk_engine
        steps:
          - task: Docker@2
            displayName: 'Build and push $(serviceName)'
            inputs:
              command: buildAndPush
              repository: $(dockerRegistry)/$(serviceName)
              dockerfile: $(dockerfilePath)
              buildContext: $(contextPath)
              tags: |
                $(imageTag)
                latest
              containerRegistry: $(dockerRegistry)

  # ============================================================
  # STAGE 3: TERRAFORM PLAN
  # ============================================================
  - stage: TerraformPlan
    displayName: Terraform Plan
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: Terraform Plan
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 20
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.6.0'
          
          - task: AzureCLI@2
            displayName: 'Azure Login'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az account set --subscription $(AZURE_SUBSCRIPTION_ID)
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: $(azureSubscription)
              backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
              backendAzureRmStorageAccountName: 'changetracetfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'changetrace.tfstate'
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: $(azureSubscription)
              commandOptions: '-var-file=environments/dev/terraform.tfvars -out=tfplan'
          
          - publish: terraform/tfplan
            artifact: terraform-plan
            displayName: 'Publish Terraform Plan'

  # ============================================================
  # STAGE 4: TERRAFORM APPLY (DEV)
  # ============================================================
  - stage: TerraformApplyDev
    displayName: Terraform Apply (Dev)
    dependsOn: [TerraformPlan, DockerBuild]
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: TerraformApply
        displayName: Apply Terraform (Dev)
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '1.6.0'
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    backendServiceArm: $(azureSubscription)
                    backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
                    backendAzureRmStorageAccountName: 'changetracetfstate'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'changetrace.tfstate'
                
                - download: current
                  artifact: terraform-plan
                  displayName: 'Download Terraform Plan'
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    environmentServiceNameAzureRM: $(azureSubscription)
                    commandOptions: 'tfplan'

  # ============================================================
  # STAGE 5: AKS DEPLOY
  # ============================================================
  - stage: AksDeploy
    displayName: Deploy to AKS
    dependsOn: [TerraformApplyDev, DockerBuild]
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: AksDeploy
        displayName: Deploy to AKS (Dev)
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(resourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy to AKS'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: 'changetrace'
                    manifests: |
                      $(System.DefaultWorkingDirectory)/k8s/namespace.yaml
                      $(System.DefaultWorkingDirectory)/k8s/configmaps/
                      $(System.DefaultWorkingDirectory)/k8s/secrets/
                      $(System.DefaultWorkingDirectory)/k8s/deployments/
                      $(System.DefaultWorkingDirectory)/k8s/services/
                      $(System.DefaultWorkingDirectory)/k8s/ingress/
                    containers: |
                      $(dockerRegistry)/collector:$(imageTag)
                      $(dockerRegistry)/correlation_engine:$(imageTag)
                      $(dockerRegistry)/dashboard_api:$(imageTag)
                      $(dockerRegistry)/graph_builder:$(imageTag)
                      $(dockerRegistry)/risk_engine:$(imageTag)
                      $(dockerRegistry)/postmortem_generator:$(imageTag)
                
                - task: Kubernetes@1
                  displayName: 'Verify Deployments'
                  inputs:
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    command: 'rollout'
                    arguments: 'status deployment/collector -n changetrace --timeout=300s'
                
                - task: Kubernetes@1
                  displayName: 'Verify Correlation Engine'
                  inputs:
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    command: 'rollout'
                    arguments: 'status deployment/correlation_engine -n changetrace --timeout=300s'
                
                - task: Kubernetes@1
                  displayName: 'Verify Dashboard API'
                  inputs:
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    command: 'rollout'
                    arguments: 'status deployment/dashboard_api -n changetrace --timeout=300s'

  # ============================================================
  # STAGE 6: CHAOS VALIDATION (MANUAL)
  # ============================================================
  - stage: ChaosValidation
    displayName: Chaos Validation
    dependsOn: AksDeploy
    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - job: RunChaosExperiments
        displayName: Run Chaos Experiments
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - task: AzureCLI@2
            displayName: 'Start AKS Cluster'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks start --resource-group $(resourceGroup) --name $(aksClusterName)
                echo "Waiting for cluster to be ready..."
                sleep 60
          
          - task: AzureCLI@2
            displayName: 'Run Chaos Experiments'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                experiments=("pod-failure" "network-latency" "cpu-pressure" "memory-pressure" "dns-failure" "disk-io-pressure")
                
                for exp in "${experiments[@]}"; do
                  echo "Starting experiment: $exp"
                  az chaos experiment start \
                    --resource-group $(resourceGroup) \
                    --name "changetrace-$exp" \
                    --no-wait
                  
                  echo "Waiting for experiment to complete..."
                  sleep 120
                  
                  status=$(az chaos experiment show \
                    --resource-group $(resourceGroup) \
                    --name "changetrace-$exp" \
                    --query "status" -o tsv)
                  echo "Experiment $exp status: $status"
                done
          
          - task: AzureCLI@2
            displayName: 'Evaluate Results'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                python chaos/scripts/evaluate_precision_recall.py \
                  --results-dir chaos/results \
                  --output evaluation_report.txt
                cat evaluation_report.txt
          
          - publish: evaluation_report.txt
            artifact: chaos-evaluation-report
            displayName: 'Publish Evaluation Report'
          
          - task: AzureCLI@2
            displayName: 'Stop AKS Cluster'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks stop --resource-group $(resourceGroup) --name $(aksClusterName)
            condition: always()

  # ============================================================
  # STAGE 7: NOTIFICATIONS
  # ============================================================
  - stage: Notify
    displayName: Notifications
    dependsOn: [BuildAndTest, DockerBuild, TerraformApplyDev, AksDeploy, ChaosValidation]
    condition: always()
    jobs:
      - job: SendNotification
        displayName: Send Pipeline Notification
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              STATUS="${{ job.status }}"
              echo "Pipeline completed with status: $STATUS"
              
              # Send to Teams/Slack
              curl -X POST "$(NOTIFICATION_WEBHOOK)" \
                -H 'Content-Type: application/json' \
                -d "{\"text\": \"ChangeTrace pipeline completed with status: $STATUS. Build: $(Build.BuildNumber)\"}"
            displayName: 'Send notification'
            env:
              NOTIFICATION_WEBHOOK: $(NOTIFICATION_WEBHOOK)