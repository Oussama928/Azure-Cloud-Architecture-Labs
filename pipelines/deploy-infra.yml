# Deploy Infrastructure Pipeline for ChangeTrace

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*

variables:
  - name: terraformVersion
    value: '1.6.0'
  - name: azureSubscription
    value: 'ChangeTrace-Dev'
  - name: resourceGroup
    value: 'changetrace-rg'
  - name: location
    value: 'eastus'

stages:
  - stage: Validate
    displayName: Validate Terraform
    jobs:
      - job: Validate
        displayName: Terraform Validate
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: $(azureSubscription)
              backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
              backendAzureRmStorageAccountName: 'changetracetfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'changetrace.tfstate'
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Format Check'
            inputs:
              provider: 'azurerm'
              command: 'fmt'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              commandOptions: '-check -recursive'

  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: Terraform Plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: $(azureSubscription)
              backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
              backendAzureRmStorageAccountName: 'changetracetfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'changetrace.tfstate'
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan (Dev)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: $(azureSubscription)
              commandOptions: '-var-file=environments/dev/terraform.tfvars -out=tfplan-dev'
          
          - publish: terraform/tfplan-dev
            artifact: terraform-plan-dev
            displayName: 'Publish Dev Plan'

  - stage: ApplyDev
    displayName: Apply Terraform (Dev)
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyDev
        displayName: Apply Terraform (Dev)
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    backendServiceArm: $(azureSubscription)
                    backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
                    backendAzureRmStorageAccountName: 'changetracetfstate'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'changetrace.tfstate'
                
                - download: current
                  artifact: terraform-plan-dev
                  displayName: 'Download Dev Plan'
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply (Dev)'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    environmentServiceNameAzureRM: $(azureSubscription)
                    commandOptions: 'tfplan-dev'

  - stage: PlanStaging
    displayName: Terraform Plan (Staging)
    dependsOn: ApplyDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PlanStaging
        displayName: Terraform Plan (Staging)
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: $(azureSubscription)
              backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
              backendAzureRmStorageAccountName: 'changetracetfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'changetrace.tfstate'
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan (Staging)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: $(azureSubscription)
              commandOptions: '-var-file=environments/staging/terraform.tfvars -out=tfplan-staging'
          
          - publish: terraform/tfplan-staging
            artifact: terraform-plan-staging
            displayName: 'Publish Staging Plan'

  - stage: ApplyStaging
    displayName: Apply Terraform (Staging)
    dependsOn: PlanStaging
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyStaging
        displayName: Apply Terraform (Staging)
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    backendServiceArm: $(azureSubscription)
                    backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
                    backendAzureRmStorageAccountName: 'changetracetfstate'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'changetrace.tfstate'
                
                - download: current
                  artifact: terraform-plan-staging
                  displayName: 'Download Staging Plan'
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply (Staging)'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    environmentServiceNameAzureRM: $(azureSubscription)
                    commandOptions: 'tfplan-staging'

  - stage: PlanProd
    displayName: Terraform Plan (Production)
    dependsOn: ApplyStaging
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PlanProd
        displayName: Terraform Plan (Production)
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: $(azureSubscription)
              backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
              backendAzureRmStorageAccountName: 'changetracetfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'changetrace.tfstate'
          
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan (Production)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: $(azureSubscription)
              commandOptions: '-var-file=environments/prod/terraform.tfvars -out=tfplan-prod'
          
          - publish: terraform/tfplan-prod
            artifact: terraform-plan-prod
            displayName: 'Publish Production Plan'

  - stage: ApplyProd
    displayName: Apply Terraform (Production)
    dependsOn: PlanProd
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyProd
        displayName: Apply Terraform (Production)
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    backendServiceArm: $(azureSubscription)
                    backendAzureRmResourceGroupName: 'changetrace-tfstate-rg'
                    backendAzureRmStorageAccountName: 'changetracetfstate'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'changetrace.tfstate'
                
                - download: current
                  artifact: terraform-plan-prod
                  displayName: 'Download Production Plan'
                
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply (Production)'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    environmentServiceNameAzureRM: $(azureSubscription)
                    commandOptions: 'tfplan-prod'