# Build Services Pipeline for ChangeTrace

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - services/*
      - functions/*
      - dashboard/*

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - services/*
      - functions/*
      - dashboard/*

variables:
  - name: dockerRegistry
    value: 'changetrace.azurecr.io'
  - name: imageTag
    value: '$(Build.BuildId)'

stages:
  - stage: BuildServices
    displayName: Build All Services
    jobs:
      - template: templates/build-service.yml
        parameters:
          serviceName: collector
          servicePath: services/collector
      
      - template: templates/build-service.yml
        parameters:
          serviceName: correlation_engine
          servicePath: services/correlation_engine
      
      - template: templates/build-service.yml
        parameters:
          serviceName: dashboard_api
          servicePath: services/dashboard_api
      
      - template: templates/build-service.yml
        parameters:
          serviceName: graph_builder
          servicePath: services/graph_builder
      
      - template: templates/build-service.yml
        parameters:
          serviceName: postmortem_generator
          servicePath: services/postmortem_generator
      
      - template: templates/build-service.yml
        parameters:
          serviceName: risk_engine
          servicePath: services/risk_engine

  - stage: BuildFunctions
    displayName: Build Azure Functions
    dependsOn: BuildServices
    jobs:
      - job: BuildFunctions
        displayName: Build & Package Functions
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          
          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | functions/requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
          
          - script: |
              pip install -r functions/requirements.txt
              pip install azure-functions-core-tools
            displayName: 'Install dependencies'
          
          - script: |
              cd functions
              func pack --output ../function-packages
            displayName: 'Package Functions'
          
          - publish: function-packages
            artifact: function-packages
            displayName: 'Publish Function Packages'

  - stage: BuildDashboard
    displayName: Build Dashboard
    dependsOn: BuildServices
    jobs:
      - job: BuildDashboard
        displayName: Build React Dashboard
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | dashboard/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)
          
          - workingDirectory: dashboard
            script: |
              npm ci
            displayName: 'Install dependencies'
          
          - workingDirectory: dashboard
            script: |
              npm run lint
            displayName: 'Lint'
          
          - workingDirectory: dashboard
            script: |
              npm test -- --watchAll=false --coverage
            displayName: 'Test'
          
          - workingDirectory: dashboard
            script: |
              npm run build
            displayName: 'Build'
          
          - publish: dashboard/build
            artifact: dashboard-build
            displayName: 'Publish Dashboard Build'