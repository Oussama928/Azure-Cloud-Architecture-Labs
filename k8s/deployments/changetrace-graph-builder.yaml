apiVersion: apps/v1
kind: Deployment
metadata:
  name: changetrace-graph-builder
  namespace: changetrace
  labels:
    app: changetrace-graph-builder
    component: graph-builder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: changetrace-graph-builder
  template:
    metadata:
      labels:
        app: changetrace-graph-builder
        component: graph-builder
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: graph-builder
          image: changetrace29r2ywacr.azurecr.io/graph_builder:v34
          ports:
            - containerPort: 8004
          env:
            - name: COSMOS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: changetrace-cosmos-secret
                  key: cosmos-connection-string
            - name: COSMOS_DB_DATABASE
              value: "changetrace-graph"
            - name: COSMOS_DB_GRAPH
              value: "dependency-graph"
            - name: DEFAULT_TENANT_ID
              value: "demo-tenant"
            - name: OTEL_RECEIVER_TENANT_ID
              value: "tenant-e5f171a28217"
            - name: LOG_ANALYTICS_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: changetrace-cosmos-secret
                  key: log-analytics-workspace-id
            - name: INTERNAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: changetrace-internal-secret
                  key: internal-auth-token
            - name: SIMPLE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: changetrace-simple-auth-secret
                  key: simple-auth-secret
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: changetrace-graph-builder
  namespace: changetrace
  labels:
    app: changetrace-graph-builder
spec:
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  selector:
    app: changetrace-graph-builder