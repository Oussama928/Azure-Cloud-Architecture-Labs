apiVersion: apps/v1
kind: Deployment
metadata:
  name: changetrace-correlation-engine
  namespace: changetrace
  labels:
    app: changetrace-correlation-engine
    component: correlation-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: changetrace-correlation-engine
  template:
    metadata:
      labels:
        app: changetrace-correlation-engine
        component: correlation-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: correlation-engine
          image: changetrace29r2ywacr.azurecr.io/correlation_engine:v16
          ports:
            - containerPort: 8003
          env:
            - name: COSMOS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: changetrace-cosmos-secret
                  key: cosmos-connection-string
            - name: COSMOS_DB_DATABASE
              value: "changetrace-graph"
            - name: COSMOS_DB_GRAPH
              value: "dependency-graph"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: changetrace-correlation-engine
  namespace: changetrace
  labels:
    app: changetrace-correlation-engine
spec:
  ports:
    - port: 8003
      targetPort: 8003
      name: http
  selector:
    app: changetrace-correlation-engine