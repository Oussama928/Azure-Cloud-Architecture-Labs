apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: changetrace
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: api-gateway
          image: changetrace29r2ywacr.azurecr.io/demo_app:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: DEPENDENCIES
              value: '["auth-service", "payment-service", "order-service"]'
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.changetrace.svc.cluster.local:4318"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: changetrace
  labels:
    app: api-gateway
spec:
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: api-gateway
