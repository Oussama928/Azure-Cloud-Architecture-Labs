apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changetrace-dashboard-ingress
  namespace: changetrace
  labels:
    app: changetrace-dashboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: changetrace.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: changetrace-dashboard-api
                port:
                  number: 8002