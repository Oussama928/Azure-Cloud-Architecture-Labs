apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: changetrace
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kubernetes-pods'
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1000
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      resource:
        attributes:
          - key: cloud.provider
            value: "azure"
            action: insert
          - key: cloud.platform
            value: "aks"
            action: insert
          - key: cloud.region
            value: "eastus"
            action: insert
      k8sattributes:
        auth_type: "none"
        passthrough: false
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.job.name
            - k8s.cronjob.name
    exporters:
      azuremonitor:
        instrumentation_key: "${APPLICATION_INSIGHTS_INSTRUMENTATION_KEY}"
      prometheus:
        endpoint: "0.0.0.0:8889"
      logging:
        loglevel: info
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [azuremonitor, logging]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [azuremonitor, prometheus, logging]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [azuremonitor, logging]