[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changetrace"
version = "0.1.0"
description = "ChangeTrace - Change Intelligence Platform for SRE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "azure-identity>=1.13.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-cosmos>=4.5.1",
    "azure-eventgrid>=4.11.0",
    "azure-mgmt-resource>=23.1.0",
    "azure-mgmt-authorization>=2.1.0",
    "azure-graphrbac>=0.61.1",
    "PyGithub>=2.1.0",
    "kubernetes>=29.0.0",
    "gremlinpython>=3.7.0",
    "tenacity>=8.2.3",
    "python-json-logger>=2.0.7",
    "scikit-learn>=1.3.2",
    "lightgbm>=4.1.0",
    "joblib>=1.3.2",
    "numpy>=1.26.2",
    "pandas>=2.1.4",
    "scipy>=1.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["services"]
include = ["*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services/*/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true