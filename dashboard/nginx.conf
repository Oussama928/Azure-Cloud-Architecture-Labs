server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

location = /api/health {
        proxy_pass http://changetrace-dashboard-api:8002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /api/ready {
        proxy_pass http://changetrace-dashboard-api:8002/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://changetrace-dashboard-api:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}