# Azure ML Pipeline Configuration for ChangeTrace

$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

display_name: changetrace-training-pipeline
description: Training pipeline for confidence and risk models
experiment_name: changetrace-training

settings:
  default_compute: cpu-cluster
  default_datastore: workspaceblobstore
  force_rerun: false

inputs:
  training_data_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/training-data/
  model_output_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/models/
  model_type:
    type: string
    default: confidence  # confidence or risk

jobs:
  # Data preparation
  prepare_data:
    type: command
    component: ./components/prepare_data.yml
    inputs:
      raw_data_path: ${{parent.inputs.training_data_path}}
      model_type: ${{parent.inputs.model_type}}
    outputs:
      processed_data:
        type: uri_folder
    compute: cpu-cluster

  # Train confidence model
  train_confidence_model:
    type: command
    component: ./components/train_confidence_model.yml
    inputs:
      training_data: ${{jobs.prepare_data.outputs.processed_data}}
      model_output_path: ${{parent.inputs.model_output_path}}
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 6
      calibrate: true
    outputs:
      model:
        type: mlflow_model
    compute: cpu-cluster
    condition: ${{eq(parent.inputs.model_type, 'confidence')}}

  # Train risk model
  train_risk_model:
    type: command
    component: ./components/train_risk_model.yml
    inputs:
      training_data: ${{jobs.prepare_data.outputs.processed_data}}
      model_output_path: ${{parent.inputs.model_output_path}}
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 6
      calibrate: true
    outputs:
      model:
        type: mlflow_model
    compute: cpu-cluster
    condition: ${{eq(parent.inputs.model_type, 'risk')}}

  # Evaluate model
  evaluate_model:
    type: command
    component: ./components/evaluate_model.yml
    inputs:
      model: ${{jobs.train_confidence_model.outputs.model}}
      test_data: ${{jobs.prepare_data.outputs.processed_data}}
      model_type: ${{parent.inputs.model_type}}
    outputs:
      metrics:
        type: uri_file
    compute: cpu-cluster

  # Register model
  register_model:
    type: command
    component: ./components/register_model.yml
    inputs:
      model: ${{jobs.train_confidence_model.outputs.model}}
      model_name: changetrace-${{parent.inputs.model_type}}-model
      model_type: ${{parent.inputs.model_type}}
      metrics: ${{jobs.evaluate_model.outputs.metrics}}
    compute: cpu-cluster

